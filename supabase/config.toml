# Supabase project configuratie
# Documentatie: https://supabase.com/docs/guides/cli/config

[project]
# Vul je Supabase project-ID in (te vinden in Project Settings → General)
# project_id = "jouw-project-id"

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------

[functions.daily-sync]
# Dagelijkse ULU-sync om 06:00 UTC (= 07:00 of 08:00 NL, afhankelijk van zomertijd)
# Pas aan naar "0 4 * * *" voor 06:00 NL wintertijd / "0 5 * * *" voor zomertijd.
# Of gebruik "0 5 * * *" als vaste tijd (05:00 UTC = 06:00/07:00 NL).
schedule = "0 5 * * *"
verify_jwt = false

# Bouw7-sync draait via Vercel Cron (apps/dashboard/vercel.json), niet via Supabase.
